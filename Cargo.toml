[package]
name = "mermaid-render"
version = "0.3.0"
edition = "2024"
description = "Pure Rust Mermaid diagram parser and SVG renderer — zero JS, zero Node, minimal deps"
license = "MIT"
repository = "https://github.com/alitrack/mermaid-render"
keywords = ["mermaid", "diagram", "svg", "renderer"]

[dependencies]
dagre = "0.1.1"
ab_glyph = { version = "0.2", optional = true }

[features]
default = []
font-measure = ["dep:ab_glyph"]
